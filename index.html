let LANG='tr';
function i18n(k,vars){let s=(LANGS[LANG]||EN)[k]||k;if(vars)for(const[a,b]of Object.entries(vars))s=s.replace('{'+a+'}',b);return s;}
function detectLang(){const c=navigator.language.slice(0,2).toLowerCase();return LANGS[c]?c:'tr';}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function isAdFree(){return lsGet(ADFREE_KEY,false)===true;}
function setAdFree(){lsSet(ADFREE_KEY,true);}
function getPlayerName(){return lsGet(NAME_KEY,'Oyuncu');}
function setPlayerName(n){lsSet(NAME_KEY,(n||'').trim().slice(0,18)||'Oyuncu');}
function getLB(){return lsGet(LB_KEY,[]);}
function addLB(score,level){const lb=getLB();lb.push({name:getPlayerName(),score,level,ts:Date.now()});lb.sort((a,b)=>b.score-a.score);lsSet(LB_KEY,lb.slice(0,50));}
function levelCfg(lv){const tier=Math.min(3,Math.floor((lv-1)/5));return{colors:tier+3,timer:BASE_TIMER-tier*5};}
const Audio={
 ctx:null,mg:null,bgOscs:[],muted:false,
 init(){if(this.ctx)return;this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.mg=this.ctx.createGain();this.mg.gain.value=0.38;this.mg.connect(this.ctx.destination);},
 resume(){try{this.init();if(this.ctx.state==='suspended')this.ctx.resume();}catch{}},
 tone(f,d,type='sine',vol=0.14){if(this.muted)return;try{this.init();const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.mg);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d);o.start();o.stop(this.ctx.currentTime+d);}catch{}},
 pickup(){this.tone(520,'sine',0.12);},
 place(){this.tone(660,'sine',0.18);},
 invalid(){this.tone(200,'sawtooth',0.14,0.08);},
 tick(){this.tone(900,'square',0.05,0.04);},
 tubeDone(){[660,880,1100].forEach((f,i)=>setTimeout(()=>this.tone(f,'sine',0.25),i*80));},
 win(){[440,550,660,880,1100].forEach((f,i)=>setTimeout(()=>this.tone(f,'sine',0.35),i*100));},
 fail(){this.tone(180,'sawtooth',0.55,0.14);},
 startBgm(){if(this.muted)return;try{this.init();[130.81,164.81,196,246.94].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.mg);o.type='sine';o.frequency.value=f;g.gain.value=0.018;o.start(this.ctx.currentTime+i*0.35);this.bgOscs.push(o);});}catch{}},
 stopBgm(){this.bgOscs.forEach(o=>{try{o.stop();}catch{}});this.bgOscs=[];},
 toggle(){this.muted=!this.muted;if(this.mg)this.mg.gain.value=this.muted?0:0.38;this.muted?this.stopBgm():this.startBgm();return this.muted;}
};
const G={phase:'splash',level:1,score:0,coins:80,tubes:[],palette:[],selected:null,timerDur:BASE_TIMER,timerLeft:BASE_TIMER,timerHandle:null,reviveUsed:false,extraTubeUsed:false,history:[],particles:[],animT:0,W:0,H:0,safeTop:0,safeBottom:0,tubeY:0,afterInterstitial:null,canvas:null,ctx:null,rafId:null,lastTime:0};
function genLevel(lv){
 const{colors}=levelCfg(lv);
 const pal=PALETTE.slice(0,colors);
 const pool=[];
 for(let i=0;i<colors;i++)for(let j=0;j<BALLS;j++)pool.push(i);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 const tubes=[];
 for(let i=0;i<colors;i++)tubes.push({blocks:[...pool.slice(i*BALLS,(i+1)*BALLS)],x:0,y:0,w:0,h:0,idx:i});
 for(let i=0;i<EMPTY;i++)tubes.push({blocks:[],x:0,y:0,w:0,h:0,idx:colors+i});
 return{tubes,palette:pal};
}
function isSolved(tubes){return tubes.every(tb=>tb.blocks.length===0||(tb.blocks.length===BALLS&&tb.blocks.every(b=>b===tb.blocks[0])));}
function canMove(from,to){if(from.blocks.length===0||to.blocks.length>=BALLS)return false;if(to.blocks.length===0)return true;return to.blocks[to.blocks.length-1]===from.blocks[from.blocks.length-1];}
function hasAnyMove(tubes){for(let i=0;i<tubes.length;i++)for(let j=0;j<tubes.length;j++)if(i!==j&&canMove(tubes[i],tubes[j]))return true;return false;}
function layoutTubes(){
 const n=G.tubes.length,bot=G.safeBottom+16,avH=G.H-G.tubeY-bot;
 const tw=Math.round(Math.min(64,Math.max(44,(G.W-16)/n-8)));
 const th=Math.round(Math.min(avH*0.96,tw*5.5));
 const total=n*tw+(n-1)*8,ox=Math.round((G.W-total)/2);
 G.tubes.forEach((tb,i)=>{tb.w=tw;tb.h=th;tb.x=ox+i*(tw+8);tb.y=G.tubeY+Math.round((avH-th)/2);});
}
function rRect(c,x,y,w,h,r){
 const[tl,tr,br,bl]=typeof r==='number'?[r,r,r,r]:r;
 c.beginPath();c.moveTo(x+tl,y);c.lineTo(x+w-tr,y);c.quadraticCurveTo(x+w,y,x+w,y+tr);c.lineTo(x+w,y+h-br);c.quadraticCurveTo(x+w,y+h,x+w-br,y+h);c.lineTo(x+bl,y+h);c.quadraticCurveTo(x,y+h,x,y+h-bl);c.lineTo(x,y+tl);c.quadraticCurveTo(x,y,x+tl,y);c.closePath();
}
function cLight(h,a){const n=parseInt(h.slice(1),16);return'rgb('+Math.min(255,(n>>16&255)+Math.round(255*a))+','+Math.min(255,(n>>8&255)+Math.round(255*a))+','+Math.min(255,(n&255)+Math.round(255*a))+')';}
function cDark(h,a){const n=parseInt(h.slice(1),16);return'rgb('+Math.max(0,(n>>16&255)-Math.round(255*a))+','+Math.max(0,(n>>8&255)-Math.round(255*a))+','+Math.max(0,(n&255)-Math.round(255*a))+')';}
function drawBall(c,cx,cy,r,col){
 const g=c.createRadialGradient(cx-r*0.3,cy-r*0.32,r*0.08,cx,cy,r);
 g.addColorStop(0,cLight(col,0.48));g.addColorStop(0.6,col);g.addColorStop(1,cDark(col,0.28));
 c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fillStyle=g;c.fill();
 c.beginPath();c.arc(cx-r*0.27,cy-r*0.27,r*0.27,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.44)';c.fill();
}
function drawScene(){
 const{ctx:c,W,H,animT,phase,tubes,palette,selected,particles}=G;
 c.clearRect(0,0,W,H);
 const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d1b3e');bg.addColorStop(1,'#0a2840');
 c.fillStyle=bg;c.fillRect(0,0,W,H);
 for(let i=0;i<6;i++){const ax=W*0.1+i*(W*0.155),ay=H*0.18+Math.sin(animT*0.6+i)*7;c.beginPath();c.arc(ax,ay,2.5,0,Math.PI*2);c.fillStyle='rgba(100,200,255,'+(0.15+Math.sin(animT+i)*0.07)+')';c.fill();}
 if(phase==='playing'||phase==='win'||phase==='over'){
 tubes.forEach((tb,idx)=>{
 const sel=selected===idx,done=tb.blocks.length===BALLS&&tb.blocks.every(b=>b===tb.blocks[0]),lift=sel?-10:0,R=12,{x,y,w,h}=tb;
 c.save();c.translate(0,lift);
 c.shadowBlur=sel?22:done?14:0;c.shadowColor=sel?'#00e5ff':'#44ff88';
 rRect(c,x,y,w,h,R);c.fillStyle=sel?'rgba(0,30,60,0.88)':done?'rgba(0,40,20,0.78)':'rgba(10,20,50,0.74)';c.fill();
 c.shadowBlur=0;rRect(c,x,y,w,h,R);c.strokeStyle=sel?'rgba(0,220,255,0.92)':done?'rgba(60,255,120,0.9)':'rgba(180,210,255,0.25)';c.lineWidth=sel?2.5:1.5;c.stroke();
 const gl=c.createLinearGradient(x,y,x+w*0.38,y);gl.addColorStop(0,'rgba(255,255,255,0.16)');gl.addColorStop(1,'rgba(255,255,255,0)');
 rRect(c,x,y,w*0.38,h,[R,0,0,R]);c.fillStyle=gl;c.fill();
 c.save();rRect(c,x+2,y+2,w-4,h-4,R-2);c.clip();
 const bw=w-10,br2=bw/2,bs=Math.min(bw+3,(h-14)/BALLS);
 tb.blocks.forEach((ci,bi)=>{drawBall(c,x+w/2,y+h-9-bi*bs-br2,br2,palette[ci]||PALETTE[ci]||'#888');});
 c.restore();c.restore();
 });
 G.particles=G.particles.filter(p=>p.life>0);
 G.particles.forEach(p=>{c.globalAlpha=p.life;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fillStyle=p.col;c.fill();});
 c.globalAlpha=1;
 }
}
function spawnParticles(x,y,col){for(let i=0;i<12;i++){const a=i/12*Math.PI*2,s=2+Math.random()*4;G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:3+Math.random()*4,col,life:1});}}
function gameLoop(ts){
 G.rafId=requestAnimationFrame(gameLoop);
 const dt=Math.min((ts-G.lastTime)/1000,0.1);G.lastTime=ts;
 G.animT+=dt;
 G.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life=Math.max(0,p.life-0.03);});
 drawScene();
}
function buildHUD(){
 const hud=document.getElementById('hud');
 const{colors,timer}=levelCfg(G.level);
 hud.innerHTML='<div style="display:flex;align-items:center;gap:6px;padding:10px 10px 0;flex-wrap:wrap;pointer-events:auto;"><div style="color:#4dd0ff;font-size:13px;font-weight:800;line-height:1.2;white-space:pre;flex-shrink:0;">Logic\nTube Pro</div><div id="hud-lp" style="background:rgba(140,100,0,0.6);border:1px solid rgba(200,160,0,0.5);border-radius:22px;padding:5px 10px;color:#fff;font-size:13px;font-weight:600;"><span style="font-size:9px;opacity:0.7;display:block;">'+i18n('lvl')+'</span><b style="font-size:15px">'+G.level+'</b><span style="font-size:8px;color:#88aaff;display:block;">'+colors+'🎨</span></div><div style="background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.14);border-radius:22px;padding:5px 10px;color:#fff;font-size:13px;font-weight:600;">⭐ <span id="hud-score">'+G.score+'</span></div><div style="background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.14);border-radius:22px;padding:5px 10px;color:#fff;font-size:13px;font-weight:600;">🪙 <span id="hud-coins">'+G.coins+'</span></div><button id="hud-mute" style="margin-left:auto;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:14px;pointer-events:auto;flex-shrink:0;">🔊</button></div><div style="padding:4px 10px 0;"><div style="font-size:9px;color:#88aaff;letter-spacing:1px;margin-bottom:2px;">🐆 '+i18n('sprint')+' · '+timer+'s</div><div style="position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,0.05);border:1px solid rgba(120,80,255,0.25);overflow:hidden;"><div id="hud-tf" style="height:100%;width:100%;border-radius:7px;background:linear-gradient(90deg,#7b2fff,#00e5ff);transition:width 0.5s linear,background 0.5s;"></div><div id="hud-ch" style="position:absolute;top:50%;transform:translateY(-50%);font-size:10px;transition:left 0.5s linear;left:88%;">🐆</div><div style="position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:10px;">🥕</div></div></div><div style="display:flex;gap:6px;padding:5px 10px 0;flex-wrap:wrap;pointer-events:auto;"><button class="btn" style="background:#c0392b;font-size:11px;padding:7px 12px;min-height:36px;" id="hud-stop">'+i18n('stop')+'</button><button class="btn" style="background:#e67e22;font-size:11px;padding:7px 12px;min-height:36px;" id="hud-stuck">'+i18n('stuck')+'</button><button class="btn" style="background:#8e44ad;font-size:11px;padding:7px 12px;min-height:36px;" id="hud-undo">'+i18n('undo')+'</button><button class="btn" style="background:#2980b9;font-size:11px;padding:7px 12px;min-height:36px;" id="hud-lb">'+i18n('lb')+'</button></div>';
 document.getElementById('hud-mute').onclick=()=>{document.getElementById('hud-mute').textContent=Audio.toggle()?'🔇':'🔊';};
 document.getElementById('hud-stop').onclick=()=>showGameOver('time');
 document.getElementById('hud-stuck').onclick=()=>showGameOver('moves');
 document.getElementById('hud-undo').onclick=()=>undoMove();
 document.getElementById('hud-lb').onclick=()=>showLeaderboard();
}
function updateHUD(){
 const sc=document.getElementById('hud-score'),co=document.getElementById('hud-coins'),tf=document.getElementById('hud-tf'),ch=document.getElementById('hud-ch'),lp=document.getElementById('hud-lp');
 if(sc)sc.textContent=G.score;
 if(co)co.textContent=G.coins;
 const pct=G.timerLeft/G.timerDur;
 if(tf){tf.style.width=(pct*100)+'%';tf.style.background=pct<0.25?'linear-gradient(90deg,#ff2244,#ff6600)':pct<0.5?'linear-gradient(90deg,#ff8800,#ffcc00)':'linear-gradient(90deg,#7b2fff,#00e5ff)';}
 if(ch)ch.style.left=Math.max(2,pct*85)+'%';
 const{colors}=levelCfg(G.level);
 if(lp)lp.innerHTML='<span style="font-size:9px;opacity:0.7;display:block;">'+i18n('lvl')+'</span><b style="font-size:15px">'+G.level+'</b><span style="font-size:8px;color:#88aaff;display:block;">'+colors+'🎨</span>';
}
function showOv(bg,html){
 const ov=document.getElementById('ov');
 ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:'+bg+';';
 ov.innerHTML=html;
}
function hideOv(){document.getElementById('ov').style.display='none';}
function showSplash(){
 G.phase='splash';stopTimer();document.getElementById('hud').style.display='none';
 const hp=G.level>1||G.score>0,af=isAdFree();
 const lo=LANGLIST.map(l=>'<option value="'+l.c+'"'+(l.c===LANG?' selected':'')+'>'+l.l+'</option>').join('');
 showOv('rgba(5,10,30,0.97)','<div style="text-align:center;padding:22px 16px;max-width:340px;width:94%;max-height:96vh;overflow-y:auto;box-sizing:border-box;"><div style="font-size:clamp(22px,7vw,40px);font-weight:900;letter-spacing:2px;margin-bottom:4px;background:linear-gradient(135deg,#4dd0ff,#7b2fff,#ff3366);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Logic Tube Pro</div><div style="color:#556;font-size:11px;margin-bottom:16px;">'+i18n('sub')+'</div><div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:14px;text-align:left;"><div style="color:#88aaff;font-size:11px;margin-bottom:6px;">'+i18n('pname')+'</div><input id="sp-name" maxlength="18" placeholder="Oyuncu" value="'+getPlayerName()+'" style="margin-bottom:12px;"/><div style="color:#88aaff;font-size:11px;margin-bottom:6px;">'+i18n('lang')+'</div><select id="sp-lang">'+lo+'</select></div><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">'+(hp?'<button id="sp-cont" class="btn btn-primary">'+i18n('cont',{n:G.level})+'</button>':'')+'<button id="sp-new" class="btn '+(hp?'btn-ghost':'btn-primary')+'" style="font-size:'+(hp?'13':'15')+'px;">'+i18n('newgame')+'</button></div><button id="sp-adf" style="background:'+(af?'rgba(68,255,136,0.1)':'rgba(255,200,0,0.1)')+';border:1px solid '+(af?'rgba(68,255,136,0.3)':'rgba(255,200,0,0.3)')+';border-radius:22px;color:'+(af?'#44ff88':'#ffcc00')+';font-size:12px;font-weight:700;padding:9px 18px;cursor:pointer;width:100%;">'+(af?i18n('adbought'):i18n('adfree')+' — '+i18n('adprice'))+'</button><div style="margin-top:10px;color:#253555;font-size:10px;">'+G.score+' puan · 🪙 '+G.coins+'</div></div>');
 document.getElementById('sp-lang').onchange=e=>{const c=e.target.value;if(LANGS[c]){LANG=c;try{localStorage.setItem('ltp_lang',c);}catch{}}};
 const sn=()=>{const v=document.getElementById('sp-name');if(v)setPlayerName(v.value);};
 if(hp)document.getElementById('sp-cont').onclick=()=>{sn();showMenu();};
 document.getElementById('sp-new').onclick=()=>{sn();G.level=1;G.score=0;G.coins=80;saveGame();showMenu();};
 document.getElementById('sp-adf').onclick=()=>{if(isAdFree()){flash(i18n('adbought'));return;}if(confirm(i18n('adfree')+' — '+i18n('adprice')+'\n\nOnaylıyor musunuz?')){setAdFree();flash(i18n('adbought'));const b=document.getElementById('sp-adf');if(b){b.style.color='#44ff88';b.textContent=i18n('adbought');}}};
}
function showMenu(){
 G.phase='menu';stopTimer();document.getElementById('hud').style.display='none';
 const{colors,timer}=levelCfg(G.level);
 showOv('rgba(8,15,40,0.93)','<div style="text-align:center;padding:24px 18px;max-width:320px;width:92%;"><div style="font-size:clamp(22px,7vw,44px);font-weight:900;letter-spacing:2px;margin-bottom:4px;background:linear-gradient(135deg,#4dd0ff,#7b2fff,#ff3366);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Logic Tube Pro</div><div style="color:#7aaecc;font-size:13px;margin-bottom:14px;">'+i18n('sub')+'</div><div style="display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;"><div style="background:rgba(77,208,255,0.09);border:1px solid rgba(77,208,255,0.26);border-radius:13px;padding:9px 10px;color:#b0d0e8;font-size:11px;text-align:center;min-width:70px;">🎯<br><b style="color:#fff">4 top</b><br>aynı renk</div><div style="background:rgba(123,47,255,0.09);border:1px solid rgba(123,47,255,0.26);border-radius:13px;padding:9px 10px;color:#b0d0e8;font-size:11px;text-align:center;min-width:70px;">🎨<br><b style="color:#fff">'+colors+' renk</b><br>Bölüm '+G.level+'</div><div style="background:rgba(255,51,102,0.09);border:1px solid rgba(255,51,102,0.24);border-radius:13px;padding:9px 10px;color:#b0d0e8;font-size:11px;text-align:center;min-width:70px;">⏰<br><b style="color:#fff">'+timer+'sn</b><br>süre</div></div><button id="mn-play" class="btn btn-primary" style="font-size:16px;padding:14px 48px;letter-spacing:1px;">'+i18n('play')+'</button><div style="margin-top:8px;"><button id="mn-back" style="background:transparent;border:none;color:#334;font-size:11px;cursor:pointer;padding:6px;">← Geri</button></div></div>');
 document.getElementById('mn-play').onclick=()=>startLevel();
 document.getElementById('mn-back').onclick=()=>showSplash();
}
function maybeInterstitial(cb){
 if(isAdFree()||G.level%5!==0){cb();return;}
 G.afterInterstitial=cb;G.phase='interstitial';stopTimer();document.getElementById('hud').style.display='none';
 let s=5;
 showOv('rgba(0,0,0,0.97)','<div style="text-align:center;padding:30px 20px;max-width:320px;width:92%;"><div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:8px;">'+i18n('ititle')+'</div><div style="width:100%;height:80px;background:linear-gradient(135deg,#7b2fff33,#00e5ff33);border:1px solid rgba(77,208,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:12px 0;color:#88aaff;font-size:12px;">📱 AdMob Banner Area</div><button id="its-skip" class="btn btn-ghost" disabled style="opacity:0.4;font-size:13px;">'+i18n('iskip')+' (<span id="its-cnt">5</span>s)</button></div>');
 const iv=setInterval(()=>{s--;const el=document.getElementById('its-cnt');if(el)el.textContent=s;if(s<=0){clearInterval(iv);const btn=document.getElementById('its-skip');if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent=i18n('iskip');}}},1000);
 document.getElementById('its-skip').onclick=()=>{if(!document.getElementById('its-skip').disabled){clearInterval(iv);hideOv();if(G.afterInterstitial)G.afterInterstitial();}};
}
function showWin(){
 G.phase='win';stopTimer();
 const bonus=Math.ceil(G.timerLeft*2)+G.level*50;
 G.score+=bonus;G.coins+=20+G.level*5;addLB(G.score,G.level);saveGame();Audio.win();
 showOv('rgba(0,16,6,0.90)','<div style="text-align:center;padding:22px 18px;max-width:300px;width:92%;"><div style="font-size:clamp(18px,6vw,36px);font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#ffcc00,#44ff88,#4dd0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">'+i18n('win')+'</div><div style="color:#88ddaa;font-size:13px;margin:6px 0 16px;">+'+bonus+' bonus · Toplam: '+G.score+'</div><button id="win-next" class="btn" style="background:linear-gradient(135deg,#44ff88,#4dd0ff);color:#041a0a;font-size:15px;padding:13px 36px;min-height:48px;">'+i18n('next')+'</button></div>');
 document.getElementById('win-next').onclick=()=>{G.level++;maybeInterstitial(()=>startLevel());};
}
function showGameOver(reason){
 if(G.phase==='over')return;G.phase='over';stopTimer();Audio.fail();
 const cr=!G.reviveUsed,hc=G.coins>=100;
 showOv('rgba(16,3,3,0.92)','<div style="text-align:center;padding:22px 18px;max-width:300px;width:92%;"><div style="font-size:clamp(16px,5vw,30px);font-weight:900;color:#ff4466;margin-bottom:6px;">'+i18n(reason==='time'?'timesup':'nomoves')+'</div><div style="color:#aa5566;font-size:12px;margin-bottom:12px;">Skor: '+G.score+' · Bölüm '+G.level+' · 🪙 '+G.coins+'</div>'+(cr?'<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;"><button id="rv-coins" class="btn" style="background:'+(hc?'linear-gradient(135deg,#f5a623,#e67e22)':'rgba(100,100,100,0.4)')+';font-size:12px;padding:10px 16px;width:230px;min-height:44px;">🪙 100 Jeton → +40 Saniye'+(hc?'':' (Yetersiz)')+'</button><button id="rv-ad" class="btn" style="background:linear-gradient(135deg,#7b2fff,#4dd0ff);font-size:12px;padding:10px 16px;width:230px;min-height:44px;">'+i18n('watchad')+'</button><button id="rv-share" class="btn" style="background:rgba(68,255,136,0.09);border:1px solid rgba(68,255,136,0.28)!important;color:#44ff88;font-size:12px;padding:10px 16px;width:230px;min-height:44px;">'+i18n('share')+'</button></div>':'')+'<button id="rv-retry" class="btn btn-ghost" style="font-size:13px;padding:10px 22px;min-height:44px;">'+i18n('retry')+'</button></div>');
 document.getElementById('rv-retry').onclick=()=>startLevel();
 if(cr){
 document.getElementById('rv-coins').onclick=()=>{if(G.coins>=100){G.coins-=100;G.reviveUsed=true;G.timerLeft=Math.min(G.timerLeft+40,G.timerDur+40);resumePlay();}else flash('Jeton yetersiz!');};
 document.getElementById('rv-ad').onclick=()=>{addExtraTube();G.reviveUsed=true;resumePlay();};
 document.getElementById('rv-share').onclick=()=>{navigator.share&&navigator.share({title:'Logic Tube Pro',url:location.href}).catch(()=>{});addExtraTube();G.reviveUsed=true;resumePlay();};
 }
}
function resumePlay(){G.phase='playing';hideOv();document.getElementById('hud').style.display='block';startTimer();updateHUD();}
function showLeaderboard(){
 const lb=getLB().slice(0,10),md=['🥇','🥈','🥉'];
 const rows=lb.length===0?'<div style="color:#556;font-size:12px;padding:10px;">Henüz sıralama yok.</div>':lb.map((e,i)=>'<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;background:rgba(255,255,255,0.04);margin-bottom:4px;"><span style="font-size:14px;width:20px;text-align:center;">'+(md[i]||(i+1)+'.')+'</span><span style="flex:1;color:#dde;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+e.name+'</span><span style="color:#ffcc44;font-size:12px;font-weight:700;">'+e.score.toLocaleString()+'</span><span style="color:#88aaff;font-size:10px;">Lv'+e.level+'</span></div>').join('');
 showOv('rgba(5,10,30,0.96)','<div style="text-align:center;padding:20px 16px;max-width:320px;width:94%;max-height:90vh;overflow-y:auto;"><div style="font-size:20px;font-weight:900;color:#ffcc44;margin-bottom:12px;">🏆 '+i18n('lb')+'</div>'+rows+'<button id="lb-close" class="btn btn-ghost" style="margin-top:14px;font-size:13px;padding:10px 24px;min-height:44px;">✕ Kapat</button></div>');
 document.getElementById('lb-close').onclick=()=>hideOv();
}
function flash(msg){const d=document.createElement('div');d.style.cssText='position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:999;pointer-events:none;background:rgba(255,50,80,0.93);color:#fff;font-weight:700;font-size:14px;padding:10px 22px;border-radius:22px;';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}
function startLevel(){
 G.phase='playing';G.reviveUsed=false;G.extraTubeUsed=false;G.selected=null;G.history=[];G.particles=[];
 const{tubes,palette}=genLevel(G.level);
 const{timer}=levelCfg(G.level);
 G.timerDur=timer;G.timerLeft=timer;G.palette=palette;
 G.tubes=tubes.map((tb,i)=>({blocks:[...tb.blocks],x:0,y:0,w:0,h:0,idx:i}));
 hideOv();document.getElementById('hud').style.display='block';
 layoutTubes();buildHUD();updateHUD();startTimer();saveGame();
}
function doMove(fi,ti){
 const from=G.tubes[fi],to=G.tubes[ti],top=from.blocks[from.blocks.length-1];
 let count=0;
 while(from.blocks.length>0&&from.blocks[from.blocks.length-1]===top&&to.blocks.length<BALLS){to.blocks.push(from.blocks.pop());count++;}
 G.history.push({fi,ti,count});G.score+=10;Audio.place();G.selected=null;
 if(to.blocks.length===BALLS&&to.blocks.every(b=>b===to.blocks[0])){Audio.tubeDone();spawnParticles(to.x+to.w/2,to.y+to.h/2,G.palette[top]||'#fff');}
 updateHUD();
 if(isSolved(G.tubes)){setTimeout(()=>showWin(),500);return;}
 if(!hasAnyMove(G.tubes))setTimeout(()=>showGameOver('moves'),400);
}
function undoMove(){
 if(!G.history.length)return;
 const{fi,ti,count}=G.history.pop(),from=G.tubes[fi],to=G.tubes[ti];
 for(let i=0;i<count;i++)from.blocks.push(to.blocks.pop());
 Audio.pickup();updateHUD();
}
function addExtraTube(){
 if(G.extraTubeUsed)return;G.extraTubeUsed=true;
 G.tubes.push({blocks:[],x:0,y:0,w:0,h:0,idx:G.tubes.length});
 layoutTubes();
}
function handleTap(cx,cy){
 if(G.phase!=='playing')return;Audio.resume();
 const idx=G.tubes.findIndex(tb=>{const lift=G.selected===tb.idx?-10:0;return cx>=tb.x&&cx<=tb.x+tb.w&&cy>=tb.y+lift&&cy<=tb.y+tb.h+lift;});
 if(idx===-1){G.selected=null;return;}
 const tb=G.tubes[idx];
 if(G.selected===null){if(tb.blocks.length===0){Audio.invalid();return;}G.selected=idx;Audio.pickup();}
 else if(G.selected===idx){G.selected=null;}
 else{const from=G.tubes[G.selected];if(canMove(from,tb))doMove(G.selected,idx);else{Audio.invalid();G.selected=null;if(tb.blocks.length>0){G.selected=idx;Audio.pickup();}}}
}
function startTimer(){stopTimer();G.timerHandle=setInterval(()=>{if(G.phase!=='playing')return;G.timerLeft=Math.max(0,G.timerLeft-1);updateHUD();if(G.timerLeft<=10)Audio.tick();if(G.timerLeft===0)showGameOver('time');},1000);}
function stopTimer(){if(G.timerHandle){clearInterval(G.timerHandle);G.timerHandle=null;}}
function saveGame(){lsSet(SAVE_KEY,{level:G.level,score:G.score,coins:G.coins,lang:LANG});}
function loadGame(){const d=lsGet(SAVE_KEY,null);if(d){G.level=d.level||1;G.score=d.score||0;G.coins=d.coins||80;if(d.lang&&LANGS[d.lang])LANG=d.lang;}}
function calcSafe(){const el=document.createElement('div');el.style.cssText='position:fixed;top:env(safe-area-inset-top,0px);left:0;width:1px;height:1px;pointer-events:none;visibility:hidden;';document.body.appendChild(el);G.safeTop=el.getBoundingClientRect().top;el.remove();G.safeBottom=Math.max(0,window.screen.height-window.innerHeight>40?48:0);}
function resize(){
 calcSafe();const dpr=Math.min(devicePixelRatio,2);
 G.W=window.innerWidth;G.H=window.innerHeight;
 G.canvas.width=G.W*dpr;G.canvas.height=G.H*dpr;
 G.ctx.setTransform(dpr,0,0,dpr,0,0);
 G.tubeY=Math.round(G.safeTop+110+8);
 if(G.tubes.length)layoutTubes();
}
function init(){
 LANG=detectLang();
 try{const l=localStorage.getItem('ltp_lang');if(l&&LANGS[l])LANG=l;}catch{}
 loadGame();
 G.canvas=document.getElementById('cv');
 G.ctx=G.canvas.getContext('2d');
 document.body.style.cssText='margin:0;overflow:hidden;touch-action:none;background:#0d1b3e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);';
 resize();
 window.addEventListener('resize',resize);
 G.canvas.addEventListener('pointerdown',e=>handleTap(e.clientX,e.clientY));
 G.lastTime=performance.now();
 G.rafId=requestAnimationFrame(gameLoop);
 Audio.startBgm();
 showSplash();
}
document.addEventListener('DOMContentLoaded',init);
</script>
